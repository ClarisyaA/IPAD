<!DOCTYPE html>
<html>
<head>
    <title>Biodata</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>Biodata</h1>

        <a href="https://www.instagram.com/clarisyaadeline/" target="_blank">
            <img src="img/logounpad.webp" width="200">
        </a>
        <br>
        
        <form action="action_page.php">
            <table>
                <tr>
                    <td>NPM &nbsp;&nbsp;&nbsp;&nbsp;</td>
                    <td><input type="text" id="npm" name="npm" required></td>
                </tr>
                
                <tr>
                    <td>Nama &nbsp;&nbsp;&nbsp;</td>
                    <td><input type="text" id="nama" name="nama" required></td>
                </tr>

                <tr>
                    <td>Alamat&nbsp;&nbsp;</td>
                    <td><textarea name="alamat" id="alamat" rows="3" cols="30" required></textarea></td>
                </tr>

                <tr>
                    <td>Jenis Kelamin :</td>
                    <td>
                        <input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki
                        <br>
                        <input type="radio" name="jenis_kelamin" value="Perempuan" required> Perempuan
                    </td>
                </tr>

                <tr>
                    <td>Angkatan : </td>
                    <td>
                        <select name="angkatan" id="angkatan" required>
                            <option value="2012">2012</option>
                            <option value="2013">2013</option>
                            <option value="2014">2014</option>
                            <option value="2015">2015</option>
                            <option value="2016">2016</option>
                            <option value="2017">2017</option>
                            <option value="2018">2018</option>
                            <option value="2019">2019</option>
                            <option value="2020">2020</option>
                            <option value="2021">2021</option>
                            <option value="2022">2022</option>
                            <option value="2023">2023</option>
                            <option value="2024">2024</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Kelas :</td>
                    <td>
                        <input type="radio" name="kelas" value="A" required> A
                        <br>
                        <input type="radio" name="kelas" value="B" required> B
                    </td>
                </tr>
                <tr>
                    <td>Hobi :</td>
                    <td>
                        <input type="checkbox" name="hobi" value="Tidur" required> Tidur
                        <br>
                        <input type="checkbox" name="hobi" value="Makan" required> Makan
                        <br>
                        <input type="checkbox" name="hobi" value="Merajut" required> Merajut
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" name="submit" value="Submit">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
