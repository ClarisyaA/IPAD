<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>
     <!-- Header -->
     <header>
        <div class="header-container">
            <h2>Welcome to Simple Calculator</h2>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <h1>Kalkulator Sederhana</h1>
        <input type="number" id="bil1" placeholder="Bilangan 1">
        <input type="number" id="bil2" placeholder="Bilangan 2">
        <div class="buttons">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">x</button>
            <button onclick="hitung('/')">/</button>
        </div>
        <p id="hasil"></p>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <p>&copy; 2024 Clarisya Adeline. All Rights Reserved.</p>
        </div>
    </footer>


    <script src="script.js"></script>

</body>
</html>
