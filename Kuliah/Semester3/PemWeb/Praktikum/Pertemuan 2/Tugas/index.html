<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>
    <header>
        <h1>Biodata Mahasiswa</h1>
    </header>

    <main>
        <div class="container">
            <a href="https://www.instagram.com/clarisyaadeline/" target="_blank">
                <img src="img/logounpad.webp" width="300" >
            </a>
            <br>

            <form action="">
                <table>
                    <tr>
                        <td><label for="npm">NPM</label></td>
                        <td><input type="text" id="npm" name="npm" required></td>
                    </tr>

                    <tr>
                        <td><label for="nama">Nama</label></td>
                        <td><input type="text" id="nama" name="nama" required></td>
                    </tr>

                    <tr>
                        <td><label for="alamat">Alamat</label></td>
                        <td><textarea name="alamat" id="alamat" rows="3" cols="30" required></textarea></td>
                    </tr>

                    <tr>
                        <td>Jenis Kelamin</td>
                        <td>
                            <span class="Huruf"><input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki</span>
                            <br>
                            <span class="Huruf"><input type="radio" name="jenis_kelamin" value="Perempuan" required> Perempuan</span>
                        </td>
                    </tr>

                    <tr>
                        <td>Angkatan</td>
                        <td>
                            <select name="angkatan" id="angkatan" required>
                                <option value="2012">2012</option>
                                <option value="2013">2013</option>
                                <option value="2014">2014</option>
                                <option value="2015">2015</option>
                                <option value="2016">2016</option>
                                <option value="2017">2017</option>
                                <option value="2018">2018</option>
                                <option value="2019">2019</option>
                                <option value="2020">2020</option>
                                <option value="2021">2021</option>
                                <option value="2022">2022</option>
                                <option value="2023">2023</option>
                                <option value="2024">2024</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Kelas</td>
                        <td>
                            <span class="Huruf"><input type="radio" name="kelas" value="A" required> A</span>
                            <br>
                            <span class="Huruf"><input type="radio" name="kelas" value="B" required> B</span>
                        </td>
                    </tr>

                    <tr>
                        <td>Hobi</td>
                        <td>
                            <span class="Huruf"><input type="checkbox" name="hobi" value="Tidur"> Tidur</span>
                            <br>
                            <span class="Huruf"><input type="checkbox" name="hobi" value="Makan"> Makan</span>
                            <br>
                            <span class="Huruf"><input type="checkbox" name="hobi" value="Merajut"> Merajut</span>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="myfile">Masukkan CV: </label></td>
                        <td><span class="Huruf"><input type="file" id="myfile" name="myfile"></span></td>
                    </tr>

                    <tr>
                        <td colspan="2" style="text-align: center;"><br>
                            <input type="submit" name="submit" class="button" value="Submit">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </main>
    <footer>
        <span style="height: 10px;">&copy; 2024 Universitas Padjadjaran - Clarisya Adeline</span>
    </footer>
</body>

</html>
