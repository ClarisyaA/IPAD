<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- charachter set = memungkinkan untuk menggunakan seluruh ASCII yang terlengkap termasuk emoji -->
    <meta name="decription" content="Belajar HTML 5">
    <meta name="keywords" content="HTML">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar HTML5</title>

    <style>
        .judul{font-weight:bold;font-size:24px;}
        article{
          width:65%;
          height:330px;
          float:left;
          padding:10px;
        }
        aside{
          width:25%;
          height:330px;
          float:left;
          padding:10px;
        }
        a{
          display:block;
        }
     </style>
    
</head>

<body>
    <header>
        <h1>BELAJAR HTML 5</h1>
    </header>
    <nav>
        <p>Apa ya?</p>
    </nav>
    <section>
        <h1>ini h1 = paling besar</h1>
        <h2>ini h2</h2>
        <h6>ini h6 = paling kecil</h6>

        <p>teks</p>
        <a href="https://docs.emmet.io/abbreviations/"> teks link</a>
    </section>
    <article>
        <p>ini artikel</p>
    </article>
    <aside>
        <ul>Ini aside
            <p>list Simbol</p>

            <li>menampilkan list</li>
        </ul>

        <ol>list angka
            <li>menampilkan list</li>
        </ol>
    </aside>


    <!-- # = id identifier
    . = class identifier 
    
    
    block-line = mengambil seukuran layar -> div

    inline = hanya mengikuti ukuran dari katanya -> span

    kalau semantic tags HTML itu ada meaning, dimengerti oleh browser bagian"nya (otomatis di recognize)
    -->



</body>


</html>
